version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: push-system-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports:
      # 只绑本机。服务走 compose 网络，不需要把 6379 暴露到局域网。
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build: .
    image: push-microservice:latest
    container_name: push-system-server
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - PUSH_ENV=${PUSH_ENV:-production}
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY:?set HMAC_SECRET_KEY}
      - PUSH_API_TOKEN=${PUSH_API_TOKEN:?set PUSH_API_TOKEN}
      - PUSH_ADMIN_TOKEN=${PUSH_ADMIN_TOKEN:?set PUSH_ADMIN_TOKEN}
      - PUSH_INTERNAL_TOKEN=${PUSH_INTERNAL_TOKEN:?set PUSH_INTERNAL_TOKEN}
      - PUSH_USE_MOCK_VECTORS=${PUSH_USE_MOCK_VECTORS:-0}
      - PUSH_TRUSTED_PROXIES=${PUSH_TRUSTED_PROXIES:-}
      - PUSH_SESSION_TTL_SEC=${PUSH_SESSION_TTL_SEC:-604800}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
