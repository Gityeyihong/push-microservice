services:
  redis:
    image: redis:7-alpine
    pull_policy: never
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  push:
    image: push-microservice:latest
    pull_policy: never
    env_file:
      - .env
    command:
      - sh
      - -c
      - exec uvicorn server.main:app --host 0.0.0.0 --port 8000 --workers $${PUSH_SERVER_WORKERS:-1}
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      PUSH_ENV: ${PUSH_ENV:-production}
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:?set HMAC_SECRET_KEY}
      PUSH_API_TOKEN: ${PUSH_API_TOKEN:?set PUSH_API_TOKEN}
      PUSH_ADMIN_TOKEN: ${PUSH_ADMIN_TOKEN:?set PUSH_ADMIN_TOKEN}
      PUSH_INTERNAL_TOKEN: ${PUSH_INTERNAL_TOKEN:?set PUSH_INTERNAL_TOKEN}
      PUSH_USE_MOCK_VECTORS: ${PUSH_USE_MOCK_VECTORS:-0}
      PUSH_TRUSTED_PROXIES: ${PUSH_TRUSTED_PROXIES:-}
      PUSH_SESSION_TTL_SEC: ${PUSH_SESSION_TTL_SEC:-604800}
      PUSH_SERVER_WORKERS: ${PUSH_SERVER_WORKERS:-1}
      POLICY_CONFIG_PATH: /app/config/policy.json
      PUSH_CONFIG_DIR: /app/config
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

